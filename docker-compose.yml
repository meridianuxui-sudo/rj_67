services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meradion
      POSTGRES_USER: meradion
      POSTGRES_PASSWORD: meradion
    ports: ["5432:5432"]
    volumes: ["meradion_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meradion -d meradion"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  meradion_pgdata:
